name: Unit Tests

on:
  pull_request:
    branches:
      - 2.4-develop
      - nx-work

permissions:
  contents: write

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout PR commit
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: main

      - name: Fetch base
        working-directory: ./main
        run: git fetch origin ${{ github.event.pull_request.base.ref }}

      - name: Checkout Nx Repo
        uses: actions/checkout@v3
        with:
          repository: adamzero1/nx-for-php
          path: nx

      - name: Install / setup Nx
        working-directory: ./main
        run: |
          npm install -g nx@15.4.1
          NXDIR="../nx"
          cp -r ${NXDIR}/nx ./ 
          cp ${NXDIR}/nx.json ./ 
          cp ${NXDIR}/package.json ./ 
          cp ${NXDIR}/package-lock.json ./ 
          cp ${NXDIR}/phpunit.mage-os.nx.xml ./phpunit.nx.xml
          npm ci
          npm run generate-workspace

      - name: Print Affected
        working-directory: ./main
        run: npm run print-affected -- --base=remotes/origin/${{ github.event.pull_request.base.ref }}

